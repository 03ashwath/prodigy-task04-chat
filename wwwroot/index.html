<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatApp — Real-Time Chat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: 'Segoe UI',sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            height: 100vh;
            display: flex;
            flex-direction: column
        }

        .hidden {
            display: none !important
        }

        /* AUTH */
        .auth-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 1rem
        }

        .auth-card {
            background: #1e293b;
            border-radius: 16px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            border: 1px solid #334155
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 1.5rem
        }

            .auth-logo .icon {
                font-size: 48px;
                margin-bottom: 8px
            }

            .auth-logo h1 {
                font-size: 22px;
                font-weight: 700;
                color: #f1f5f9
            }

            .auth-logo p {
                font-size: 13px;
                color: #64748b;
                margin-top: 4px
            }

        .auth-tabs {
            display: flex;
            background: #0f172a;
            border-radius: 10px;
            padding: 3px;
            margin-bottom: 1.25rem
        }

        .auth-tab {
            flex: 1;
            padding: 8px;
            border: none;
            background: transparent;
            color: #64748b;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-family: 'Segoe UI',sans-serif
        }

            .auth-tab.active {
                background: #3b82f6;
                color: #fff
            }

        .input {
            width: 100%;
            padding: 10px 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 14px;
            font-family: 'Segoe UI',sans-serif;
            outline: none;
            margin-bottom: 10px
        }

            .input:focus {
                border-color: #3b82f6
            }

        .btn-primary {
            width: 100%;
            padding: 11px;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'Segoe UI',sans-serif
        }

            .btn-primary:hover {
                opacity: .88
            }

        .msg {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 8px;
            display: none
        }

            .msg.error {
                background: #450a0a;
                color: #fca5a5;
                display: block
            }

            .msg.success {
                background: #052e16;
                color: #86efac;
                display: block
            }

        /* APP LAYOUT */
        .app-screen {
            display: flex;
            flex: 1;
            overflow: hidden
        }

        /* SIDEBAR */
        .sidebar {
            width: 280px;
            background: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            flex-shrink: 0
        }

        .sidebar-header {
            padding: 14px 16px;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between
        }

        .sidebar-title {
            font-size: 16px;
            font-weight: 600;
            color: #f1f5f9
        }

        .sidebar-actions {
            display: flex;
            gap: 6px
        }

        .icon-btn {
            background: #334155;
            border: none;
            color: #94a3b8;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center
        }

            .icon-btn:hover {
                background: #475569
            }

        .user-info {
            padding: 12px 16px;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 10px
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #3b82f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0
        }

        .user-details {
            flex: 1
        }

        .user-name {
            font-size: 14px;
            font-weight: 500;
            color: #f1f5f9
        }

        .user-status {
            font-size: 12px;
            color: #22c55e;
            display: flex;
            align-items: center;
            gap: 4px
        }

            .user-status::before {
                content: '';
                width: 6px;
                height: 6px;
                background: #22c55e;
                border-radius: 50%;
                display: inline-block
            }

        .logout-btn {
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 16px
        }

        /* TABS */
        .sidebar-tabs {
            display: flex;
            border-bottom: 1px solid #334155
        }

        .sidebar-tab {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            font-size: 13px;
            font-family: 'Segoe UI',sans-serif;
            border-bottom: 2px solid transparent
        }

            .sidebar-tab.active {
                color: #3b82f6;
                border-bottom-color: #3b82f6
            }

        /* ROOM LIST */
        .room-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px
        }

        .room-item {
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background .15s;
            margin-bottom: 2px
        }

            .room-item:hover {
                background: #334155
            }

            .room-item.active {
                background: #1d4ed8
            }

        .room-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0
        }

        .room-item.active .room-icon {
            background: #2563eb
        }

        .room-info {
            flex: 1;
            min-width: 0
        }

        .room-name {
            font-size: 14px;
            font-weight: 500;
            color: #f1f5f9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .room-last {
            font-size: 12px;
            color: #64748b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .online-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            flex-shrink: 0
        }

        .offline-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #475569;
            flex-shrink: 0
        }

        .unread-badge {
            background: #ef4444;
            color: #fff;
            border-radius: 99px;
            font-size: 11px;
            padding: 1px 6px;
            font-weight: 600
        }

        /* CHAT AREA */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden
        }

        .chat-header {
            padding: 14px 16px;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 12px;
            background: #1e293b
        }

        .chat-header-info {
            flex: 1
        }

        .chat-header-name {
            font-size: 16px;
            font-weight: 600;
            color: #f1f5f9
        }

        .chat-header-status {
            font-size: 12px;
            color: #64748b
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .empty-chat {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: #475569
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 8px
        }

        /* MESSAGES */
        .msg-row {
            display: flex;
            gap: 8px;
            align-items: flex-end
        }

            .msg-row.mine {
                flex-direction: row-reverse
            }

        .msg-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            flex-shrink: 0
        }

        .msg-bubble {
            max-width: 65%;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5
        }

        .msg-row:not(.mine) .msg-bubble {
            background: #1e293b;
            border: 1px solid #334155;
            color: #f1f5f9;
            border-bottom-left-radius: 4px
        }

        .msg-row.mine .msg-bubble {
            background: #3b82f6;
            color: #fff;
            border-bottom-right-radius: 4px
        }

        .msg-meta {
            font-size: 11px;
            margin-top: 3px;
            opacity: .7
        }

        .msg-sender {
            font-size: 11px;
            color: #64748b;
            margin-bottom: 2px
        }

        .typing-indicator {
            font-size: 12px;
            color: #64748b;
            padding: 4px 0;
            min-height: 20px
        }

        /* INPUT */
        .chat-input-area {
            padding: 12px 16px;
            border-top: 1px solid #334155;
            background: #1e293b
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: center
        }

        .msg-input {
            flex: 1;
            padding: 10px 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #f1f5f9;
            font-size: 14px;
            font-family: 'Segoe UI',sans-serif;
            outline: none;
            resize: none
        }

            .msg-input:focus {
                border-color: #3b82f6
            }

        .send-btn {
            background: #3b82f6;
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0
        }

            .send-btn:hover {
                opacity: .88
            }

        .attach-btn {
            background: #334155;
            border: none;
            color: #94a3b8;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center
        }

            .attach-btn:hover {
                background: #475569
            }

        /* MODAL */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.6);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem
        }

        .modal {
            background: #1e293b;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #334155
        }

        .modal-header {
            padding: 14px 16px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .modal-title {
            font-size: 15px;
            font-weight: 600;
            color: #f1f5f9
        }

        .close-btn {
            background: none;
            border: none;
            color: #64748b;
            font-size: 20px;
            cursor: pointer
        }

        .modal-body {
            padding: 1.25rem
        }

        /* NOTIFICATION */
        .notif {
            position: fixed;
            top: 16px;
            right: 16px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 13px;
            z-index: 200;
            max-width: 280px;
            transition: opacity .3s;
            opacity: 0;
            display: flex;
            gap: 10px;
            align-items: flex-start
        }

            .notif.show {
                opacity: 1
            }

        .notif-icon {
            font-size: 20px;
            flex-shrink: 0
        }

        .notif-content {
            flex: 1
        }

        .notif-title {
            font-weight: 500;
            color: #f1f5f9;
            margin-bottom: 2px
        }

        .notif-msg {
            color: #94a3b8;
            font-size: 12px
        }

        /* NO CHAT SELECTED */
        .no-chat {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: #475569;
            text-align: center;
            padding: 2rem
        }

        .no-chat-icon {
            font-size: 64px;
            margin-bottom: 12px
        }
    </style>
</head>
<body>

    <!-- AUTH SCREEN -->
    <div id="auth-screen" class="auth-screen">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="icon">💬</div>
                <h1>ChatApp</h1>
                <p>Real-time messaging platform</p>
            </div>
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">Sign in</button>
                <button class="auth-tab" onclick="switchTab('register')">Sign up</button>
            </div>
            <div id="login-form">
                <input class="input" type="email" id="l-email" placeholder="Email address" autocomplete="off" />
                <input class="input" type="password" id="l-pw" placeholder="Password" autocomplete="off" />
                <button class="btn-primary" onclick="doLogin()">Sign in →</button>
                <div class="msg" id="login-msg"></div>
                <div style="margin-top:12px;font-size:12px;color:#64748b;text-align:center">
                    Demo: alice@chat.com / alice123 or bob@chat.com / bob123
                </div>
            </div>
            <div id="register-form" style="display:none">
                <input class="input" type="text" id="r-name" placeholder="Full name" autocomplete="off" />
                <input class="input" type="email" id="r-email" placeholder="Email address" autocomplete="off" />
                <input class="input" type="password" id="r-pw" placeholder="Password (min 6 chars)" autocomplete="off" />
                <button class="btn-primary" onclick="doRegister()">Create account →</button>
                <div class="msg" id="reg-msg"></div>
            </div>
        </div>
    </div>

    <!-- APP SCREEN -->
    <div id="app-screen" class="app-screen hidden">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">💬 ChatApp</span>
                <div class="sidebar-actions">
                    <button class="icon-btn" onclick="openCreateRoom()" title="Create Room">+</button>
                </div>
            </div>
            <div class="user-info">
                <div class="avatar" id="my-avatar">U</div>
                <div class="user-details">
                    <div class="user-name" id="my-name">User</div>
                    <div class="user-status">Online</div>
                </div>
                <button class="logout-btn" onclick="doLogout()" title="Sign out">↪</button>
            </div>
            <div class="sidebar-tabs">
                <button class="sidebar-tab active" onclick="switchSidebarTab('rooms', this)">🏠 Rooms</button>
                <button class="sidebar-tab" onclick="switchSidebarTab('dms', this)">👤 Direct</button>
            </div>
            <div class="room-list" id="room-list"></div>
        </div>

        <!-- CHAT AREA -->
        <div class="chat-area">
            <div class="no-chat" id="no-chat">
                <div class="no-chat-icon">💬</div>
                <div style="font-size:18px;font-weight:600;color:#94a3b8;margin-bottom:8px">Select a chat</div>
                <div style="font-size:14px;color:#475569">Choose a room or person to start chatting</div>
            </div>
            <div id="chat-view" class="hidden" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
                <div class="chat-header">
                    <div class="avatar" id="chat-avatar" style="width:38px;height:38px;font-size:16px">?</div>
                    <div class="chat-header-info">
                        <div class="chat-header-name" id="chat-name">Chat</div>
                        <div class="chat-header-status" id="chat-status">Loading...</div>
                    </div>
                </div>
                <div class="chat-messages" id="chat-messages"></div>
                <div class="typing-indicator" id="typing-indicator" style="padding:0 16px 4px"></div>
                <div class="chat-input-area">
                    <div class="input-row">
                        <textarea class="msg-input" id="msg-input" placeholder="Type a message..." rows="1"
                                  onkeydown="handleKeyDown(event)" oninput="handleTyping()"></textarea>
                        <button class="send-btn" onclick="sendMessage()">➤</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- NOTIFICATION -->
    <div class="notif" id="notif">
        <div class="notif-icon">💬</div>
        <div class="notif-content">
            <div class="notif-title" id="notif-title">New message</div>
            <div class="notif-msg" id="notif-msg"></div>
        </div>
    </div>

    <!-- CREATE ROOM MODAL -->
    <div class="overlay hidden" id="room-modal">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title">Create New Room</span>
                <button class="close-btn" onclick="closeModal('room-modal')">×</button>
            </div>
            <div class="modal-body">
                <input class="input" id="room-name" placeholder="Room name (e.g. Design Team)" autocomplete="off" />
                <input class="input" id="room-desc" placeholder="Description (optional)" autocomplete="off" />
                <button class="btn-primary" onclick="createRoom()">Create Room</button>
                <div class="msg" id="room-msg"></div>
            </div>
        </div>
    </div>

    <script>
const API = 'http://localhost:5053/api';
let token = '', currentUser = null, connection = null;
let currentRoom = null, currentDM = null, activeTab = 'rooms';
let typingTimeout = null, users = [], rooms = [];

// ── AUTH ──────────────────────────────────────────────
function switchTab(tab) {
  document.getElementById('login-form').style.display = tab === 'login' ? '' : 'none';
  document.getElementById('register-form').style.display = tab === 'register' ? '' : 'none';
  document.querySelectorAll('.auth-tab').forEach((t, i) => t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register')));
}

function showMsg(id, text, type) { const el = document.getElementById(id); el.textContent = text; el.className = 'msg ' + type; }

async function doLogin() {
  const email = document.getElementById('l-email').value.trim();
  const pw = document.getElementById('l-pw').value;
  if (!email || !pw) { showMsg('login-msg', 'Please fill all fields.', 'error'); return; }
  try {
    const res = await fetch(`${API}/Auth/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: '', email, password: pw }) });
    const data = await res.json();
    if (!res.ok) { showMsg('login-msg', data.message || 'Login failed.', 'error'); return; }
    token = data.token; currentUser = data;
    localStorage.setItem('token', token);
    localStorage.setItem('user', JSON.stringify(data));
    startApp();
  } catch { showMsg('login-msg', 'Cannot connect to server.', 'error'); }
}

async function doRegister() {
  const name = document.getElementById('r-name').value.trim();
  const email = document.getElementById('r-email').value.trim();
  const pw = document.getElementById('r-pw').value;
  if (!name || !email || !pw) { showMsg('reg-msg', 'Please fill all fields.', 'error'); return; }
  if (pw.length < 6) { showMsg('reg-msg', 'Password must be 6+ characters.', 'error'); return; }
  try {
    const res = await fetch(`${API}/Auth/register`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, email, password: pw }) });
    const data = await res.json();
    if (!res.ok) { showMsg('reg-msg', data.message || 'Failed.', 'error'); return; }
    token = data.token; currentUser = data;
    localStorage.setItem('token', token);
    localStorage.setItem('user', JSON.stringify(data));
    startApp();
  } catch { showMsg('reg-msg', 'Cannot connect to server.', 'error'); }
}

function doLogout() {
  if (connection) connection.stop();
  token = ''; currentUser = null;
  localStorage.removeItem('token'); localStorage.removeItem('user');
  document.getElementById('auth-screen').classList.remove('hidden');
  document.getElementById('app-screen').classList.add('hidden');
}

// ── APP START ─────────────────────────────────────────
async function startApp() {
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('app-screen').classList.remove('hidden');
  document.getElementById('my-avatar').textContent = currentUser.avatar || currentUser.name[0].toUpperCase();
  document.getElementById('my-name').textContent = currentUser.name;
  await loadRooms();
  await loadUsers();
  await connectSignalR();
}

async function loadRooms() {
  try {
    const res = await fetch(`${API}/Rooms`, { headers: { Authorization: `Bearer ${token}` } });
    rooms = await res.json();
    if (activeTab === 'rooms') renderRooms();
  } catch (e) { console.error(e); }
}

async function loadUsers() {
  try {
    const res = await fetch(`${API}/Auth/users`, { headers: { Authorization: `Bearer ${token}` } });
    users = await res.json();
    if (activeTab === 'dms') renderUsers();
  } catch (e) { console.error(e); }
}

function renderRooms() {
  const list = document.getElementById('room-list');
  if (!rooms.length) { list.innerHTML = `<div style="text-align:center;color:#475569;padding:2rem;font-size:13px">No rooms yet.<br>Create one with the + button!</div>`; return; }
  list.innerHTML = rooms.map(r => `
    <div class="room-item ${currentRoom?.id === r.id ? 'active' : ''}" onclick="openRoom(${r.id}, '${r.name}', '${r.description || ''}')">
      <div class="room-icon">#</div>
      <div class="room-info">
        <div class="room-name">${r.name}</div>
        <div class="room-last">${r.lastMessage ? r.lastMessage.content.substring(0, 30) : r.description || 'No messages yet'}</div>
      </div>
    </div>`).join('');
}

function renderUsers() {
  const list = document.getElementById('room-list');
  if (!users.length) { list.innerHTML = `<div style="text-align:center;color:#475569;padding:2rem;font-size:13px">No other users yet</div>`; return; }
  list.innerHTML = users.map(u => `
    <div class="room-item ${currentDM?.id === u.id ? 'active' : ''}" onclick="openDM(${u.id}, '${u.name}', '${u.avatar || u.name[0]}', ${u.isOnline})">
      <div class="avatar" style="width:38px;height:38px;font-size:15px;background:${u.isOnline ? '#1d4ed8' : '#334155'}">${u.avatar || u.name[0].toUpperCase()}</div>
      <div class="room-info">
        <div class="room-name">${u.name}</div>
        <div class="room-last" style="color:${u.isOnline ? '#22c55e' : '#475569'}">${u.isOnline ? '● Online' : '○ Offline'}</div>
      </div>
      <div class="${u.isOnline ? 'online-dot' : 'offline-dot'}"></div>
    </div>`).join('');
}

function switchSidebarTab(tab, btn) {
  activeTab = tab;
  document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  if (tab === 'rooms') renderRooms();
  else renderUsers();
}

// ── SIGNALR ───────────────────────────────────────────
async function connectSignalR() {
  connection = new signalR.HubConnectionBuilder()
    .withUrl(`http://localhost:5053/chatHub?access_token=${token}`)
    .withAutomaticReconnect()
    .build();

  connection.on('ReceiveRoomMessage', msg => {
    if (currentRoom && msg.roomId === currentRoom.id) {
      appendMessage(msg, false);
    } else {
      showNotif(msg.senderName, msg.content);
    }
  });

  connection.on('ReceivePrivateMessage', msg => {
    if (currentDM && (msg.senderId === currentDM.id || msg.receiverId === currentDM.id)) {
      appendMessage(msg, false);
    } else if (msg.senderId !== currentUser.id) {
      showNotif(msg.senderName, msg.content);
    }
  });

  connection.on('UserOnline', userId => {
    const u = users.find(x => x.id === userId);
    if (u) { u.isOnline = true; if (activeTab === 'dms') renderUsers(); }
    if (currentDM?.id === userId) document.getElementById('chat-status').textContent = '● Online';
  });

  connection.on('UserOffline', userId => {
    const u = users.find(x => x.id === userId);
    if (u) { u.isOnline = false; if (activeTab === 'dms') renderUsers(); }
    if (currentDM?.id === userId) document.getElementById('chat-status').textContent = 'Offline';
  });

  connection.on('UserTyping', data => {
    const el = document.getElementById('typing-indicator');
    if (data.roomId === currentRoom?.id) {
      el.textContent = data.isTyping ? `${data.userName} is typing...` : '';
    }
  });

  connection.on('UserJoinedRoom', data => {
    if (currentRoom?.id === data.roomId) {
      const el = document.createElement('div');
      el.style.cssText = 'text-align:center;font-size:12px;color:#475569;padding:4px 0';
      el.textContent = `${data.userName} joined the room`;
      document.getElementById('chat-messages').appendChild(el);
    }
  });

  try {
    await connection.start();
    console.log('SignalR connected!');
  } catch (e) {
    console.error('SignalR error:', e);
  }
}

// ── CHAT ──────────────────────────────────────────────
async function openRoom(id, name, desc) {
  if (currentRoom?.id === id) return;
  if (currentRoom) await connection.invoke('LeaveRoom', currentRoom.id);
  currentRoom = { id, name }; currentDM = null;
  document.getElementById('chat-avatar').textContent = '#';
  document.getElementById('chat-avatar').style.background = '#1d4ed8';
  document.getElementById('chat-name').textContent = name;
  document.getElementById('chat-status').textContent = desc || 'Room chat';
  document.getElementById('no-chat').classList.add('hidden');
  document.getElementById('chat-view').classList.remove('hidden');
  document.getElementById('chat-messages').innerHTML = '';
  document.getElementById('typing-indicator').textContent = '';
  await connection.invoke('JoinRoom', id);
  await loadRoomHistory(id);
  renderRooms();
}

async function openDM(id, name, avatar, isOnline) {
  if (currentRoom) { await connection.invoke('LeaveRoom', currentRoom.id); currentRoom = null; }
  currentDM = { id, name };
  document.getElementById('chat-avatar').textContent = avatar.toUpperCase();
  document.getElementById('chat-avatar').style.background = isOnline ? '#1d4ed8' : '#334155';
  document.getElementById('chat-name').textContent = name;
  document.getElementById('chat-status').textContent = isOnline ? '● Online' : 'Offline';
  document.getElementById('no-chat').classList.add('hidden');
  document.getElementById('chat-view').classList.remove('hidden');
  document.getElementById('chat-messages').innerHTML = '';
  await loadDMHistory(id);
  renderUsers();
}

async function loadRoomHistory(roomId) {
  try {
    const res = await fetch(`${API}/Rooms/${roomId}/messages`, { headers: { Authorization: `Bearer ${token}` } });
    const messages = await res.json();
    messages.forEach(m => appendMessage(m, true));
    scrollToBottom();
  } catch (e) { console.error(e); }
}

async function loadDMHistory(userId) {
  try {
    const res = await fetch(`${API}/Rooms/private/${userId}`, { headers: { Authorization: `Bearer ${token}` } });
    const messages = await res.json();
    messages.forEach(m => appendMessage(m, true));
    scrollToBottom();
  } catch (e) { console.error(e); }
}

function appendMessage(msg, isHistory) {
  const container = document.getElementById('chat-messages');
  const isMine = msg.senderId === currentUser.id;
  const time = new Date(msg.sentAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const div = document.createElement('div');
  div.className = `msg-row ${isMine ? 'mine' : ''}`;
  div.innerHTML = `
    <div class="msg-avatar" style="background:${isMine ? '#3b82f6' : '#334155'}">${(msg.senderAvatar || msg.senderName?.[0] || '?').toUpperCase()}</div>
    <div>
      ${!isMine ? `<div class="msg-sender">${msg.senderName}</div>` : ''}
      <div class="msg-bubble">${escapeHtml(msg.content)}</div>
      <div class="msg-meta">${time}</div>
    </div>`;
  container.appendChild(div);
  if (!isHistory) scrollToBottom();
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const content = input.value.trim();
  if (!content || !connection) return;
  input.value = '';
  try {
    if (currentRoom) {
      await connection.invoke('SendRoomMessage', currentRoom.id, content);
    } else if (currentDM) {
      await connection.invoke('SendPrivateMessage', currentDM.id, content);
      appendMessage({
        content, senderId: currentUser.id,
        senderName: currentUser.name,
        senderAvatar: currentUser.avatar,
        sentAt: new Date().toISOString()
      }, false);
    }
  } catch (e) { console.error(e); }
}

function handleKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

async function handleTyping() {
  if (!currentRoom || !connection) return;
  try {
    await connection.invoke('SendTyping', currentRoom.id, true);
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(async () => {
      await connection.invoke('SendTyping', currentRoom.id, false);
    }, 2000);
  } catch (e) { }
}

// ── ROOMS ─────────────────────────────────────────────
function openCreateRoom() { document.getElementById('room-modal').classList.remove('hidden'); }

async function createRoom() {
  const name = document.getElementById('room-name').value.trim();
  const desc = document.getElementById('room-desc').value.trim();
  if (!name) { showMsg('room-msg', 'Please enter a room name.', 'error'); return; }
  try {
    const res = await fetch(`${API}/Rooms`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ name, description: desc })
    });
    if (!res.ok) { showMsg('room-msg', 'Failed to create room.', 'error'); return; }
    document.getElementById('room-name').value = '';
    document.getElementById('room-desc').value = '';
    closeModal('room-modal');
    await loadRooms();
    showNotif('Room created!', `#${name} is ready`);
  } catch { showMsg('room-msg', 'Cannot connect.', 'error'); }
}

// ── UTILS ─────────────────────────────────────────────
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
function scrollToBottom() {
  const el = document.getElementById('chat-messages');
  el.scrollTop = el.scrollHeight;
}
function escapeHtml(text) {
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function showNotif(title, msg) {
  document.getElementById('notif-title').textContent = title;
  document.getElementById('notif-msg').textContent = msg;
  const el = document.getElementById('notif');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 4000);
}

// Auto login
window.onload = () => {
  const t = localStorage.getItem('token');
  const u = localStorage.getItem('user');
  if (t && u) { token = t; currentUser = JSON.parse(u); startApp(); }
};
